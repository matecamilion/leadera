# Perfil de desarrollo local
# Variables de entorno requeridas (con fallback para arrancar rapido en local):
#   DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leadera_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Matecamilion2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JPA puro, sin dialecto especifico (Hibernate lo detecta solo)
# Cuando migremos a Postgres alcanza con cambiar DB_URL y el driver

# JWT
app.jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-prod-32-bytes-min-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
