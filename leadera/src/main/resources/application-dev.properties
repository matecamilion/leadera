# Perfil de desarrollo local
# Variables de entorno requeridas: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, CORS_ALLOWED_ORIGINS
# Los secretos (DB_PASSWORD, JWT_SECRET) NO tienen fallback a proposito: si no estan
# seteados, la app debe fallar al arrancar en vez de usar un default inseguro.
# En dev local seteá estas variables de entorno o usá un archivo .env no commiteado.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leadera_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JPA puro, sin dialecto especifico (Hibernate lo detecta solo)
# Cuando migremos a Postgres alcanza con cambiar DB_URL y el driver

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Supabase Storage (subida de fotos mediada por el backend).
# La service role key es un secreto: sin fallback, igual que DB_PASSWORD y
# JWT_SECRET. Se obtiene en Supabase > Project Settings > API > service_role.
supabase.url=${SUPABASE_URL:https://vjefoduwdiwhvuzakmsm.supabase.co}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.bucket=fotos-propiedades
