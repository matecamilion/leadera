# Perfil exclusivo de tests de integración: H2 en memoria, esquema
# recreado en cada corrida. No toca MySQL (dev) ni Postgres (prod).
spring.datasource.url=jdbc:h2:mem:leadera_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Secreto SOLO de tests (HS256 exige >= 32 bytes). No es un secreto real.
app.jwt.secret=clave-de-test-no-productiva-para-jwt-hs256-de-leadera-1234567890
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:4200
